# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your postal or ZIP code: with a Google maps_key (Geocoding API on), it sets latitude, longitude and city for you.
postal_code=

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), en, es or pt
language=auto



# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true makes Free My TV the screensaver too; false (the default) keeps the TV's own, like Google's Ambient mode.
own_screensaver=false

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Ask AI (Gemini). Free key: https://aistudio.google.com/apikey. Secret: it stays in config.properties, which git ignores.
gemini_key=
gemini_model=gemini-flash-latest
# true lets answers search Google and show their sources
gemini_grounding=true

# Radar map tiles: google (Map Tiles API, https://console.cloud.google.com/google/maps-apis), maptiler
# (https://cloud.maptiler.com/account/keys) or mapbox (https://account.mapbox.com). Without a key, Esri's free grey map.
maps_provider=google
maps_key=
